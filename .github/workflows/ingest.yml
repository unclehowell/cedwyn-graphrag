name: ingest
# Re-runs the migration of every non-datro Cedwyn webapp repo + catalogue + legal wiki into the statement graph,
# then commits fresh static JSON (data/). Run by hand (Actions > ingest > Run workflow), weekly, or from worker/trigger.js.
# It waits for any running Cedwyn site build to finish first, and never cancels one. — Sion's Tab agent
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional comma-separated repo names (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * 0"
permissions:
  contents: write
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Wait for any running Cedwyn site build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 12); do
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/unclehowell/cedwyn/actions/runs?status=in_progress&per_page=1" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("total_count",0))' || echo 0)
            if [ "$n" = "0" ]; then echo "no Cedwyn build running"; exit 0; fi
            echo "a Cedwyn build is running ($n); waiting 5 min"; sleep 300
          done
          echo "still busy after an hour; skipping this run"; echo "SKIP=1" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.11"
      - name: Ingest
        if: env.SKIP != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install numpy==2.1.3
          if [ -n "${{ github.event.inputs.only }}" ]; then python3 tools/ingest.py --out data --only "${{ github.event.inputs.only }}"; else python3 tools/ingest.py --out data; fi
      - name: Commit data
        if: env.SKIP != '1'
        run: |
          git config user.name "cedwyn-graphrag bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "ingest: refresh statement graph $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
